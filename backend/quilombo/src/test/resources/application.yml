spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  base-domain: quilombo.localhost
  jwt:
    secret: test-secret-key-for-junit-tests-only-not-production
    expiration-hours: 1
  auth:
    email-hash-secret: test-email-hash-secret-for-junit-tests-only
    refresh-expiration-days: 14
    cookie-secure: false
    # audiência do idToken; o GoogleTokenVerifier é stubado nos ITs (sem rede)
    google-client-id: test-client-id
  storage:
    limit-bytes: 52428800
    upload-max-bytes: 5242880
    image-max-dimension: 1920
    # storage mockado nos testes; o cliente S3 sobe anônimo e nunca é exercido
    endpoint: ""
    access-key: ""
    secret-key: ""
    bucket: quilombo-test
    region: us-east-1
    public-base-url: http://localhost:9000/quilombo-test
