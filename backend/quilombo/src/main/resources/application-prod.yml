spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  flyway:
    clean-disabled: true
    out-of-order: false
    # Migração: usuário DONO do schema, separado da role de runtime (RLS).
    url: ${DATABASE_URL}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}

logging:
  level:
    root: WARN
    com.quilombo: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
