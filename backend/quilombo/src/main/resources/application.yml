spring:
  application:
    name: quilombo

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  datasource:
    # Runtime conecta como a role NÃO-DONA quilombo_app — sem privilégio de
    # furar o RLS. A migração usa o datasource do Flyway (dono), abaixo.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quilombo}
    username: ${DB_USERNAME:quilombo_app}
    password: ${DB_PASSWORD:quilombo_app}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: quilombo-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    # Migração conecta como o usuário DONO do schema (cria tabelas e políticas
    # RLS; o dono não é afetado pelo RLS — separado da role de runtime).
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quilombo}
    user: ${DB_MIGRATION_USERNAME:quilombo}
    password: ${DB_MIGRATION_PASSWORD:quilombo}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: openid,email,profile

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: on_param

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  base-domain: ${APP_BASE_DOMAIN:quilombo.localhost}
  storage:
    limit-bytes: 52428800
    upload-max-bytes: 5242880
    image-max-dimension: 1920
  sections:
    limit: 20
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-in-production}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  auth:
    email-hash-secret: ${EMAIL_HASH_SECRET:dev-only-email-hash-secret-change-in-production}
