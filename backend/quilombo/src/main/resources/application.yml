spring:
  application:
    name: quilombo

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quilombo}
    username: ${DB_USERNAME:quilombo}
    password: ${DB_PASSWORD:quilombo}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: quilombo-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: openid,email,profile

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: on_param

spring:
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  base-domain: ${APP_BASE_DOMAIN:quilombo.localhost}
  storage:
    limit-bytes: 52428800
    upload-max-bytes: 5242880
    image-max-dimension: 1920
  sections:
    limit: 20
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-in-production}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
