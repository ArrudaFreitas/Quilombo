spring:
  application:
    name: quilombo

  datasource:
    url: jdbc:postgresql://localhost:5432/quilombo
    username: quilombo
    password: quilombo
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: openid,email,profile

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  base-domain: quilombo.localhost
  storage:
    limit-bytes: 52428800    # 50 MB por comunidade
    upload-max-bytes: 5242880 # 5 MB antes do processamento
    image-max-dimension: 1920
  sections:
    limit: 20
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-in-production}
    expiration-hours: 24
