spring:
  application:
    name: quilombo

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  datasource:
    # Runtime conecta como a role NÃO-DONA quilombo_app — sem privilégio de
    # furar o RLS. A migração usa o datasource do Flyway (dono), abaixo.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quilombo}
    username: ${DB_USERNAME:quilombo_app}
    password: ${DB_PASSWORD:quilombo_app}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: quilombo-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    # Migração conecta como o usuário DONO do schema (cria tabelas e políticas
    # RLS; o dono não é afetado pelo RLS — separado da role de runtime).
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quilombo}
    user: ${DB_MIGRATION_USERNAME:quilombo}
    password: ${DB_MIGRATION_PASSWORD:quilombo}

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      # Teto do container acima da quota da aplicação (app.storage.upload-max-bytes),
      # para que o 413 com mensagem própria venha da regra de negócio, não do framework.
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: on_param

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  base-domain: ${APP_BASE_DOMAIN:quilombo.localhost}
  storage:
    limit-bytes: 52428800
    upload-max-bytes: 5242880
    image-max-dimension: 1920
    # Conexão S3-compatível. Em dev/Docker, as MINIO_* do compose preenchem;
    # sem elas (Maven local sem storage) o cliente sobe mas não é exercido.
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:quilombo-uploads}
    region: ${STORAGE_REGION:us-east-1}
    # Base pública dos objetos servida ao navegador (host, não a rede interna do Docker)
    public-base-url: ${MINIO_PUBLIC_URL:http://localhost:9000/quilombo-uploads}
  sections:
    limit: 20
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-in-production}
    # access token curto — a sessão longa vive no cookie de refresh rotacionado
    expiration-hours: ${JWT_EXPIRATION_HOURS:1}
  auth:
    email-hash-secret: ${EMAIL_HASH_SECRET:dev-only-email-hash-secret-change-in-production}
    refresh-expiration-days: ${REFRESH_EXPIRATION_DAYS:14}
    cookie-secure: true
    # client-id do OAuth do Google: audiência esperada do idToken (GIS). Sem segredo —
    # a verificação é só com as chaves públicas do Google.
    google-client-id: ${GOOGLE_CLIENT_ID:placeholder}
