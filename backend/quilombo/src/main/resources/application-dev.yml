spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/quilombo_dev
    username: quilombo
    password: quilombo
    hikari:
      maximum-pool-size: 5

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false
    baseline-on-migrate: true
    out-of-order: true

logging:
  level:
    root: INFO
    com.quilombo: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true
