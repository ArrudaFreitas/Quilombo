spring:
  datasource:
    # Fallback para dev local sem Docker. Em Docker, DATABASE_URL sobrescreve.
    # Runtime conecta como a role NÃO-DONA quilombo_app (o RLS vale para ela).
    url:      ${DATABASE_URL:jdbc:postgresql://localhost:5432/quilombo_dev}
    username: ${DB_USERNAME:quilombo_app}
    password: ${DB_PASSWORD:quilombo_app}
    hikari:
      maximum-pool-size: 5

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false
    baseline-on-migrate: true
    out-of-order: true
    # Migração como o usuário DONO (fallback local segue o datasource acima)
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quilombo_dev}
    user: ${DB_MIGRATION_USERNAME:quilombo}
    password: ${DB_MIGRATION_PASSWORD:quilombo}

app:
  seed:
    # Semeia as comunidades do MVP (e o admin de DEV_ADMIN_EMAIL) na subida.
    # Os testes de integração desligam via TestcontainersConfiguration.
    enabled: true

logging:
  level:
    root: INFO
    com.quilombo: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true
