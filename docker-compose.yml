services:

  # ── Banco de dados ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB:       quilombo
      POSTGRES_USER:     quilombo
      POSTGRES_PASSWORD: quilombo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Provisiona a role de runtime (quilombo_app) na 1ª subida do volume.
      # Volume já existente não reexecuta: docker compose down -v && up.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U quilombo -d quilombo"]
      interval:     5s
      timeout:      5s
      retries:      10
      start_period: 10s

  # ── Object storage (S3-compatível para dev) ─────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     quilombo
      MINIO_ROOT_PASSWORD: quilombo123
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"   # console web acessível em http://localhost:9001
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 15s

  # Cria o bucket na primeira vez que o MinIO sobe
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # Policy customizada (em vez de `mc anonymous set download`) porque o canned
    # policy "download" do mc embute s3:ListBucket junto com s3:GetObject — a
    # aplicação sempre acessa por chave direta (nunca lista o bucket no browser),
    # então aqui é só GetObject: nem escrita/deleção, nem enumeração anônima de keys.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 quilombo quilombo123
        mc mb --ignore-existing local/quilombo-uploads
        cat <<'JSON' > /tmp/anon-policy.json
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {"AWS": ["*"]},
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::quilombo-uploads/*"]
            }
          ]
        }
        JSON
        mc anonymous set-json /tmp/anon-policy.json local/quilombo-uploads
        echo "[minio] bucket quilombo-uploads pronto (leitura por chave, sem write/delete/list)."
    restart: on-failure

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend/quilombo
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL:           jdbc:postgresql://postgres:5432/quilombo
      # Runtime conecta como a role NÃO-DONA quilombo_app — o RLS vale para ela
      DB_USERNAME:            quilombo_app
      DB_PASSWORD:            quilombo_app
      # Flyway/migração conecta como o usuário DONO (cria schema e políticas)
      DB_MIGRATION_USERNAME:  quilombo
      DB_MIGRATION_PASSWORD:  quilombo
      JWT_SECRET:             dev-docker-secret-nao-usar-em-producao
      EMAIL_HASH_SECRET:      dev-docker-email-hash-nao-usar-em-producao
      # Seu e-mail Google — o seed o registra como admin das comunidades de dev
      DEV_ADMIN_EMAIL:        ${DEV_ADMIN_EMAIL:-}
      # Client-id do OAuth do Google: audiência esperada do idToken. Mesmo id do front.
      GOOGLE_CLIENT_ID:       ${GOOGLE_CLIENT_ID:-}
      APP_BASE_DOMAIN:        quilombo.ianarruda.dev
      # MinIO — endpoint interno (rede do compose) para o backend gravar/remover;
      # MINIO_PUBLIC_URL é a base servida ao navegador: relativa e same-origin, pois o
      # nginx faz proxy de /quilombo-uploads/ ao MinIO (não a rede interna nem localhost:9000).
      MINIO_ENDPOINT:         http://minio:9000
      MINIO_ACCESS_KEY:       quilombo
      MINIO_SECRET_KEY:       quilombo123
      MINIO_BUCKET:           quilombo-uploads
      MINIO_PUBLIC_URL:       /quilombo-uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:         ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval:     10s
      timeout:      5s
      retries:      12
      start_period: 60s

  # ── Frontend (Next.js em modo dev, com HMR via bind mount) ──────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    # npm install é no-op quando o lockfile não mudou; node_modules fica em
    # volume nomeado para não conflitar com instalações feitas no host.
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      API_URL: "http://backend:8080"
      NEXT_PUBLIC_BASE_DOMAIN: "quilombo.ianarruda.dev"
      # Client-id do OAuth do Google — habilita o botão do Google Identity Services.
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  # ── Reverse proxy ───────────────────────────────────────────────────────────
  nginx:
    build:
      context:    ./infra/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:8443"
    volumes:
      # Certificados de dev gerados no host com mkcert (confiáveis — .dev é HSTS-preloaded
      # e o navegador não permite furar cert inválido). Gitignored. Ver infra/nginx/README.
      - ./infra/nginx/certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
