worker_processes auto;

# Roda como usuário não-root (nginx, uid 101) — pid e diretórios de cache ficam em /tmp
# (sempre gravável por qualquer uid), já que /var/run e /var/cache/nginx são root:root.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    # Não usamos fastcgi/uwsgi/scgi, mas o nginx valida esses diretórios no startup
    # independente disso — sem redirecioná-los, o bind falha (são /var/cache/nginx/*).
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Esconde a versão do nginx e do upstream (Tomcat) nas respostas.
    server_tokens off;
    proxy_hide_header Server;

    # Usa o DNS embutido do Docker para resolver nomes de serviço em tempo de requisição,
    # não em startup — evita "host not found" quando o container ainda não está registrado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # limite generoso para uploads (backend valida 5 MB após processamento)
    client_max_body_size 20m;

    # Mitigação de força-bruta/credential-stuffing contra a troca do idToken do Google.
    # Status 429 (em vez do 503 padrão do nginx) é o código correto para rate limit (RFC 6585).
    limit_req_zone $binary_remote_addr zone=authlimit:10m rate=5r/s;
    limit_req_status 429;

    # Upgrade de WebSocket (HMR do Next em dev)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8443 ssl;
        server_name quilombo.ianarruda.dev *.quilombo.ianarruda.dev;

        ssl_certificate     /etc/nginx/certs/quilombo.crt;
        ssl_certificate_key /etc/nginx/certs/quilombo.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Defesa em profundidade: .dev já é HSTS-preloaded no navegador, mas o header
        # explícito cobre clientes que não respeitam a preload list (curl, libs HTTP etc.).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # O Host original (com porta) é preservado via $http_host — o backend lê o subdomínio
        # para resolver o tenant (getServerName ignora a porta) e o frontend reaproveita o Host
        # para montar links cross-subdomínio com a porta de dev (ex.: kalunga.<base>:8080).
        # Sem esse header, kalunga.quilombo.ianarruda.dev chegaria como "backend:8080" e os
        # links de comunidade perderiam o ":8080" (iriam para a 8443, sem nada ouvindo).
        # As variáveis $backend_host/$frontend_host forçam resolução DNS lazy
        # (necessário com resolver Docker e permite subir os serviços em qualquer ordem).

        # Troca do idToken do Google — limitada à parte (^~ vence a location regex abaixo).
        location ^~ /api/v1/auth/ {
            limit_req zone=authlimit burst=10 nodelay;
            set $backend_host backend:8080;
            proxy_pass         http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # API e endpoints do Spring (actuator, Swagger em dev) → backend
        location ~ ^/(api/|actuator|swagger-ui|v3/api-docs) {
            set $backend_host backend:8080;
            proxy_pass         http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # Mídia same-origin: /quilombo-uploads/<key> → bucket no MinIO. Mantém as imagens
        # no mesmo origin (HTTPS) — sem mixed-content e sem vazar a URL interna do MinIO
        # ao browser. Em produção o storage seria um domínio público de CDN (sem este proxy).
        location /quilombo-uploads/ {
            limit_except GET HEAD { deny all; }
            set $minio_host minio:9000;
            proxy_pass         http://$minio_host;
            proxy_http_version 1.1;
            proxy_set_header   Host $minio_host;
        }

        # Todo o resto (páginas, assets, HMR) → frontend Next.js
        location / {
            set $frontend_host frontend:3000;
            proxy_pass         http://$frontend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }
    }
}
