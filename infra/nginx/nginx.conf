worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;

    # Usa o DNS embutido do Docker para resolver nomes de serviço em tempo de requisição,
    # não em startup — evita "host not found" quando o container ainda não está registrado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # limite generoso para uploads (backend valida 5 MB após processamento)
    client_max_body_size 20m;

    # Upgrade de WebSocket (HMR do Next em dev)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 443 ssl;
        server_name quilombo.localhost *.quilombo.localhost;

        ssl_certificate     /etc/nginx/certs/quilombo.crt;
        ssl_certificate_key /etc/nginx/certs/quilombo.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # O Host original é preservado — o backend lê o subdomínio para resolver o tenant.
        # Sem esse header, kalunga.quilombo.localhost chegaria como "backend:8080".
        # As variáveis $backend_host/$frontend_host forçam resolução DNS lazy
        # (necessário com resolver Docker e permite subir os serviços em qualquer ordem).

        # API e endpoints do Spring (OAuth2, actuator, Swagger em dev) → backend
        location ~ ^/(api/|oauth2/|login/oauth2/|actuator|swagger-ui|v3/api-docs) {
            set $backend_host backend:8080;
            proxy_pass         http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # Todo o resto (páginas, assets, HMR) → frontend Next.js
        location / {
            set $frontend_host frontend:3000;
            proxy_pass         http://$frontend_host;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }
    }
}
